<!DOCTYPE html>
<html lang="en" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JL's Daily Organizer</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    tailwind.config = { darkMode: 'class' }
  </script>
</head>
<body class="bg-[#f5f2eb] dark:bg-[#1e2022] text-[#4a4e51] dark:text-[#d1d5db] font-sans min-h-screen p-4 sm:p-8 transition-colors duration-200">
  <div class="max-w-6xl mx-auto space-y-6">
    
    <header class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 bg-[#fefcf8] dark:bg-[#282a2d] p-6 rounded-2xl shadow-sm border border-[#e8e4dc] dark:border-[#383b3e] transition-colors duration-200">
      <div>
        <div class="flex items-center gap-3">
          <h1 class="text-2xl font-semibold text-[#383d40] dark:text-[#f3f4f6]">Daily Organizer</h1>
          <span id="date-badge" class="px-2.5 py-0.5 rounded-full text-xs font-medium bg-[#e8e4dc] dark:bg-[#383b3e] text-[#4a4e51] dark:text-[#d1d5db]">Today</span>
          <span id="sync-status" class="text-xs text-[#84a98c] font-medium hidden">● Live Synced</span>
        </div>
        <p id="current-date-display" class="text-[#8c9296] dark:text-[#9ca3af] text-sm mt-1"></p>
      </div>
      
      <div class="flex flex-wrap items-center gap-3 w-full sm:w-auto justify-between sm:justify-end">
        <div class="flex items-center gap-2 bg-[#f8f6f0] dark:bg-[#323538] p-1.5 rounded-lg border border-[#e2dedc] dark:border-[#404347]">
          <label for="date-picker" class="text-xs font-medium text-[#8c9296] dark:text-[#9ca3af] pl-1">Date:</label>
          <input type="date" id="date-picker" onchange="changeDate(this.value)" 
                 class="bg-transparent text-xs font-medium text-[#383d40] dark:text-[#f3f4f6] focus:outline-none cursor-pointer">
        </div>

        <button onclick="exportCurrentDayHTML()" title="Download today's state as a standalone named HTML file"
                class="p-2 rounded-lg bg-[#f8f6f0] dark:bg-[#323538] border border-[#e2dedc] dark:border-[#404347] hover:bg-[#e8e4dc] dark:hover:bg-[#404347] transition flex items-center justify-center">
          <svg class="w-4 h-4 text-[#4a4e51] dark:text-[#d1d5db]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4"></path>
          </svg>
        </button>

        <button id="theme-toggle" onclick="toggleDarkMode()" title="Toggle Light/Dark Theme"
                class="p-2 rounded-lg bg-[#f8f6f0] dark:bg-[#323538] border border-[#e2dedc] dark:border-[#404347] hover:bg-[#e8e4dc] dark:hover:bg-[#404347] transition flex items-center justify-center">
          <span id="theme-icon" class="text-sm">🌙</span>
        </button>

        <div class="text-right pl-2 border-l border-[#e8e4dc] dark:border-[#383b3e]">
          <span class="text-[10px] font-medium uppercase tracking-wider text-[#8c9296] dark:text-[#9ca3af] block">Progress</span>
          <div class="text-xl font-semibold text-[#84a98c] dark:text-[#a3b18a]" id="progress-text">0%</div>
        </div>
      </div>
    </header>

    <div id="archived-banner" class="hidden bg-[#f1eee6] dark:bg-[#323538] border border-[#e2dedc] dark:border-[#404347] p-3 rounded-xl text-xs text-[#8c9296] dark:text-[#9ca3af] flex justify-between items-center">
      <span>📜 Viewing archived entry for <strong id="archive-date-label" class="text-[#383d40] dark:text-[#f3f4f6]"></strong>. Edits auto-save to cloud.</span>
      <button onclick="goToToday()" class="text-[#84a98c] dark:text-[#a3b18a] font-semibold hover:underline">Return to Today</button>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      
      <section class="lg:col-span-2 bg-[#fefcf8] dark:bg-[#282a2d] p-6 rounded-2xl shadow-sm border border-[#e8e4dc] dark:border-[#383b3e] transition-colors duration-200">
        <div class="flex justify-between items-center mb-4">
          <h2 class="text-lg font-medium text-[#383d40] dark:text-[#f3f4f6]">Time Blocks (9:00 AM – 8:00 PM)</h2>
          <span class="text-xs text-[#8c9296] dark:text-[#9ca3af]">Auto-saves as you type</span>
        </div>
        <div id="schedule-container" class="grid grid-cols-1 md:grid-cols-2 gap-3 overflow-y-auto pr-1"></div>
      </section>

      <div class="space-y-6">
        
        <section class="bg-[#fefcf8] dark:bg-[#282a2d] p-6 rounded-2xl shadow-sm border border-[#e8e4dc] dark:border-[#383b3e] transition-colors duration-200">
          <h2 class="text-lg font-medium text-[#383d40] dark:text-[#f3f4f6] mb-4">To-Do List</h2>
          
          <form id="task-form" class="flex gap-2 mb-4">
            <input type="text" id="task-input" placeholder="Add a task..." required
                   class="flex-1 px-3 py-2 bg-[#f8f6f0] dark:bg-[#323538] border border-[#e2dedc] dark:border-[#404347] text-[#4a4e51] dark:text-[#e5e7eb] rounded-lg focus:outline-none focus:border-[#9db4c0] dark:focus:border-[#829ab1] text-sm">
            <button type="submit" 
                    class="bg-[#84a98c] hover:bg-[#6b8e73] dark:bg-[#a3b18a] dark:hover:bg-[#84a98c] text-white dark:text-[#1e2022] px-4 py-2 rounded-lg text-sm font-medium transition">
              Add
            </button>
          </form>

          <ul id="task-list" class="space-y-2 max-h-[180px] overflow-y-auto pr-1"></ul>
        </section>

        <section class="bg-[#fefcf8] dark:bg-[#282a2d] p-6 rounded-2xl shadow-sm border border-[#e8e4dc] dark:border-[#383b3e] transition-colors duration-200">
          <h2 class="text-lg font-medium text-[#383d40] dark:text-[#f3f4f6] mb-4">Habits & Routines</h2>
          <div class="space-y-2">
            <label class="flex items-center justify-between p-2.5 rounded-lg bg-[#f8f6f0] dark:bg-[#323538] transition border border-[#e2dedc] dark:border-[#404347]">
              <div class="flex items-center gap-2">
                <span class="text-sm text-[#4a4e51] dark:text-[#d1d5db]">💧 Drink Water</span>
                <span id="water-count" class="text-xs text-[#8c9296] dark:text-[#9ca3af] font-medium">(0/4)</span>
              </div>
              <input type="checkbox" id="habit-water" disabled class="w-4 h-4 accent-[#9db4c0] dark:accent-[#829ab1] rounded cursor-not-allowed opacity-80">
            </label>

            <label class="flex items-center justify-between p-2.5 rounded-lg bg-[#f8f6f0] dark:bg-[#323538] cursor-pointer hover:bg-[#f1eee6] dark:hover:bg-[#3b3e42] transition border border-transparent">
              <span class="text-sm text-[#4a4e51] dark:text-[#d1d5db]">🏃 Exercise / Walk</span>
              <input type="checkbox" id="habit-exercise" onchange="toggleHabit('exercise')" class="w-4 h-4 accent-[#9db4c0] dark:accent-[#829ab1] rounded">
            </label>

            <label class="flex items-center justify-between p-2.5 rounded-lg bg-[#f8f6f0] dark:bg-[#323538] cursor-pointer hover:bg-[#f1eee6] dark:hover:bg-[#3b3e42] transition border border-transparent">
              <span class="text-sm text-[#4a4e51] dark:text-[#d1d5db]">📖 Read 15 Mins</span>
              <input type="checkbox" id="habit-read" onchange="toggleHabit('read')" class="w-4 h-4 accent-[#9db4c0] dark:accent-[#829ab1] rounded">
            </label>
          </div>
        </section>

        <section class="bg-[#fefcf8] dark:bg-[#282a2d] p-6 rounded-2xl shadow-sm border border-[#e8e4dc] dark:border-[#383b3e] transition-colors duration-200">
          <h2 class="text-lg font-medium text-[#383d40] dark:text-[#f3f4f6] mb-2">Brain Dump</h2>
          <textarea id="notes" placeholder="Jot down quick thoughts..." oninput="saveNotes(this.value)"
                    class="w-full h-24 p-3 border border-[#e2dedc] dark:border-[#404347] rounded-lg text-sm focus:outline-none focus:border-[#c2afd0] dark:focus:border-[#a388ee] resize-none bg-[#f8f6f0] dark:bg-[#323538] text-[#4a4e51] dark:text-[#e5e7eb]"></textarea>
        </section>

      </div>
    </div>
  </div>

  <script>
    // Paste your real Supabase credentials here
    const SUPABASE_URL = "https://zeplhjklsuxwndpwfnyl.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InplcGxoamtsc3V4d25kcHdmbnlsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY5OTQ5ODgsImV4cCI6MjEwMjU3MDk4OH0.teirDhtZKFaIrxmsyrHu8TubK1GYQKCJXEsgc4SVb9g";

    let supabaseClient = null;

    const HOURS = [
      "9:00 AM", "10:00 AM", "11:00 AM", "12:00 PM", "1:00 PM", "2:00 PM",
      "3:00 PM", "4:00 PM", "5:00 PM", "6:00 PM", "7:00 PM", "8:00 PM"
    ];

    const WATER_SLOTS = ["11:00 AM", "2:00 PM", "5:00 PM", "8:00 PM"];

    function getTodayString() {
      const today = new Date();
      const year = today.getFullYear();
      const month = String(today.getMonth() + 1).padStart(2, '0');
      const day = String(today.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    let activeDate = getTodayString();
    let currentData = { schedule: {}, waterCheckmarks: {}, tasks: [], habits: { water: false, exercise: false, read: false }, notes: "" };
    let saveTimeout = null;
    let isUserTyping = false;

    document.addEventListener('DOMContentLoaded', async () => {
      initTheme();
      document.getElementById('date-picker').value = activeDate;
      renderAllUI();

      if (typeof supabase !== 'undefined' && SUPABASE_URL !== "https://zeplhjklsuxwndpwfnyl.supabase.co") {
        try {
          supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
          await checkRolloverAndLoad();
          subscribeRealtime();
        } catch (e) {
          console.warn("Supabase init failed, falling back to local mode:", e);
          loadLocalFallback();
        }
      } else {
        loadLocalFallback();
      }
    });

    function loadLocalFallback() {
      const local = localStorage.getItem(`organizer_day_${activeDate}`);
      if (local) {
        try { currentData = JSON.parse(local); } catch(e){}
      }
      renderAllUI();
    }

    function subscribeRealtime() {
      if (!supabaseClient) return;
      supabaseClient
        .channel('organizer_data_changes')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'organizer_data' }, payload => {
          if (payload.new && payload.new.date_key === activeDate) {
            if (!isUserTyping) {
              currentData = payload.new.data;
              renderAllUI();
            }
          }
        })
        .subscribe();
    }

    async function checkRolloverAndLoad() {
      if (!supabaseClient) return;
      const today = getTodayString();
      const lastOpened = localStorage.getItem('organizer_last_opened') || today;

      if (lastOpened !== today) {
        await handleDayRollover(lastOpened, today);
      }

      localStorage.setItem('organizer_last_opened', today);
      await loadDateData(activeDate);
    }

    async function handleDayRollover(previousDay, newDay) {
      if (!supabaseClient) return;
      const { data: prevDataRow } = await supabaseClient
        .from('organizer_data')
        .select('data')
        .eq('date_key', previousDay)
        .maybeSingle();
        
      let prevData = prevDataRow ? prevDataRow.data : null;

      let rolledOverTasks = [];
      if (prevData && prevData.tasks) {
        const uncompleted = prevData.tasks.filter(t => !t.completed);
        rolledOverTasks = uncompleted.map(t => ({ ...t, id: Date.now() + Math.random() }));
      }

      const { data: existingNew } = await supabaseClient
        .from('organizer_data')
        .select('date_key')
        .eq('date_key', newDay)
        .maybeSingle();

      if (!existingNew) {
        const newData = {
          schedule: {},
          waterCheckmarks: {},
          tasks: rolledOverTasks,
          habits: { water: false, exercise: false, read: false },
          notes: ""
        };
        await supabaseClient.from('organizer_data').upsert({ date_key: newDay, data: newData });
      }
    }

    async function loadDateData(dateStr) {
      activeDate = dateStr;
      const today = getTodayString();

      if (supabaseClient) {
        const { data: row } = await supabaseClient
          .from('organizer_data')
          .select('data')
          .eq('date_key', dateStr)
          .maybeSingle();

        if (row && row.data) {
          currentData = row.data;
        } else {
          currentData = { schedule: {}, waterCheckmarks: {}, tasks: [], habits: { water: false, exercise: false, read: false }, notes: "" };
        }
      } else {
        loadLocalFallback();
      }

      currentData.schedule = currentData.schedule || {};
      currentData.waterCheckmarks = currentData.waterCheckmarks || {};
      currentData.tasks = currentData.tasks || [];
      currentData.habits = currentData.habits || { water: false, exercise: false, read: false };
      currentData.notes = currentData.notes || "";

      updateHeaderUI(dateStr, today);
      renderAllUI();
    }

    function renderAllUI() {
      renderSchedule();
      renderTasks();
      renderHabits();
      const notesEl = document.getElementById('notes');
      if (document.activeElement !== notesEl) {
        notesEl.value = currentData.notes || "";
      }
    }

    function saveActiveData() {
      localStorage.setItem(`organizer_day_${activeDate}`, JSON.stringify(currentData));

      if (supabaseClient) {
        const status = document.getElementById('sync-status');
        status.textContent = "● Saving...";
        status.classList.remove('hidden');

        clearTimeout(saveTimeout);
        saveTimeout = setTimeout(async () => {
          await supabaseClient.from('organizer_data').upsert({ date_key: activeDate, data: currentData, updated_at: new Date() });
          status.textContent = "● Live Synced";
          isUserTyping = false;
        }, 1000);
      }
    }

    function updateHeaderUI(selectedDate, today) {
      const dateObj = new Date(selectedDate + "T00:00:00");
      const dateFormatted = dateObj.toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric', year: 'numeric' });
      document.getElementById('current-date-display').textContent = dateFormatted;

      const badge = document.getElementById('date-badge');
      const banner = document.getElementById('archived-banner');

      if (selectedDate === today) {
        badge.textContent = "Today";
        badge.className = "px-2.5 py-0.5 rounded-full text-xs font-medium bg-[#84a98c] text-white";
        banner.classList.add('hidden');
      } else {
        badge.textContent = "Archived";
        badge.className = "px-2.5 py-0.5 rounded-full text-xs font-medium bg-[#e07a5f] text-white";
        banner.classList.remove('hidden');
        document.getElementById('archive-date-label').textContent = selectedDate;
      }
    }

    function changeDate(newDate) { if (newDate) loadDateData(newDate); }
    function goToToday() { const today = getTodayString(); document.getElementById('date-picker').value = today; loadDateData(today); }

    function renderSchedule() {
      const container = document.getElementById('schedule-container');
      if (!container) return;

      const activeEl = document.activeElement;
      const activeTimeSlot = activeEl ? activeEl.getAttribute('data-time') : null;

      container.innerHTML = '';

      HOURS.forEach(time => {
        const value = (currentData.schedule && currentData.schedule[time]) ? currentData.schedule[time] : '';
        const isWaterSlot = WATER_SLOTS.includes(time);
        const waterChecked = !!(currentData.waterCheckmarks && currentData.waterCheckmarks[time]);

        const card = document.createElement('div');
        card.className = 'p-2.5 rounded-xl bg-[#f8f6f0] dark:bg-[#323538] border border-[#e2dedc] dark:border-[#404347] flex flex-col justify-between space-y-1 h-auto transition-all';
        card.innerHTML = `
          <div class="flex justify-between items-center">
            <span class="text-xs font-semibold text-[#8c9296] dark:text-[#9ca3af]">${time}</span>
            ${isWaterSlot ? `
              <label class="flex items-center gap-1 cursor-pointer bg-[#e8e4dc] dark:bg-[#282a2d] px-1.5 py-0.5 rounded-md text-[10px] font-medium text-[#4a4e51] dark:text-[#d1d5db]">
                <span>💧 Water</span>
                <input type="checkbox" ${waterChecked ? 'checked' : ''} onchange="toggleWaterSlot('${time}')" class="w-3 h-3 accent-[#84a98c] dark:accent-[#a3b18a] rounded cursor-pointer">
              </label>
            ` : ''}
          </div>
          <textarea rows="1" placeholder="Empty slot" data-time="${time}"
                    oninput="autoExpandTextarea(this); saveSchedule('${time}', this.value)"
                    class="w-full bg-transparent text-sm text-[#4a4e51] dark:text-[#e5e7eb] focus:outline-none resize-none break-words whitespace-pre-wrap overflow-hidden leading-snug">${escapeHtml(value)}</textarea>
        `;
        container.appendChild(card);

        const textarea = card.querySelector('textarea');
        if (textarea && value) {
          setTimeout(() => autoExpandTextarea(textarea), 0);
        }

        if (activeTimeSlot && activeTimeSlot === time) {
          setTimeout(() => {
            textarea.focus();
            textarea.setSelectionRange(textarea.value.length, textarea.value.length);
          }, 0);
        }
      });
    }

    function autoExpandTextarea(element) {
      element.style.height = 'auto';
      element.style.height = element.scrollHeight + 'px';
    }

    function saveSchedule(time, val) { 
      isUserTyping = true;
      currentData.schedule[time] = val; 
      saveActiveData(); 
    }

    function toggleWaterSlot(time) {
      currentData.waterCheckmarks[time] = !currentData.waterCheckmarks[time];
      const completedCount = WATER_SLOTS.filter(slot => currentData.waterCheckmarks[slot]).length;
      currentData.habits.water = (completedCount === WATER_SLOTS.length);
      saveActiveData();
      renderHabits();
    }

    document.getElementById('task-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const input = document.getElementById('task-input');
      const text = input.value.trim();
      if (text) {
        currentData.tasks.push({ id: Date.now(), text, completed: false });
        input.value = '';
        saveActiveData();
        renderTasks();
      }
    });

    function toggleTask(id) { currentData.tasks = currentData.tasks.map(t => t.id === id ? { ...t, completed: !t.completed } : t); saveActiveData(); renderTasks(); }
    function deleteTask(id) { currentData.tasks = currentData.tasks.filter(t => t.id !== id); saveActiveData(); renderTasks(); }

    function renderTasks() {
      const list = document.getElementById('task-list');
      if (!list) return;
      list.innerHTML = '';
      if (currentData.tasks.length === 0) {
        list.innerHTML = `<li class="text-[#8c9296] dark:text-[#9ca3af] text-xs text-center py-4">No tasks recorded</li>`;
      } else {
        currentData.tasks.forEach(task => {
          const li = document.createElement('li');
          li.className = `flex items-center justify-between p-2 rounded-lg border border-[#e2dedc] dark:border-[#404347] ${task.completed ? 'bg-[#f8f6f0] dark:bg-[#323538]' : 'bg-[#fefcf8] dark:bg-[#282a2d]'}`;
          li.innerHTML = `
            <div class="flex items-center gap-2.5 overflow-hidden pr-2">
              <input type="checkbox" ${task.completed ? 'checked' : ''} onchange="toggleTask(${task.id})" class="w-4 h-4 accent-[#84a98c] dark:accent-[#a3b18a] rounded cursor-pointer flex-shrink-0">
              <span class="text-sm break-words ${task.completed ? 'line-through text-[#8c9296] dark:text-[#6b7280]' : 'text-[#4a4e51] dark:text-[#e5e7eb]'}">${escapeHtml(task.text)}</span>
            </div>
            <button onclick="deleteTask(${task.id})" class="text-[#8c9296] hover:text-[#e07a5f] text-xs px-1 flex-shrink-0">✕</button>
          `;
          list.appendChild(li);
        });
      }
      updateProgress();
    }

    // Updated Progress Calculation (Includes Tasks + Habits)
    function updateProgress() {
      let totalItems = 0;
      let completedItems = 0;

      // 1. Calculate To-Do List Tasks
      if (currentData.tasks && currentData.tasks.length > 0) {
        totalItems += currentData.tasks.length;
        completedItems += currentData.tasks.filter(t => t.completed).length;
      }

      // 2. Calculate Habits (3 Habit Items: Water, Exercise, Reading)
      const habitKeys = ['water', 'exercise', 'read'];
      totalItems += habitKeys.length;

      habitKeys.forEach(key => {
        if (currentData.habits && currentData.habits[key]) {
          completedItems += 1;
        }
      });

      // 3. Render Combined Percentage
      const percentage = totalItems > 0 ? Math.round((completedItems / totalItems) * 100) : 0;
      document.getElementById('progress-text').textContent = `${percentage}%`;
    }

    function toggleHabit(key) { 
      currentData.habits[key] = document.getElementById(`habit-${key}`).checked; 
      saveActiveData(); 
      updateProgress();
    }

    function renderHabits() {
      const completedCount = WATER_SLOTS.filter(slot => currentData.waterCheckmarks[slot]).length;
      document.getElementById('water-count').textContent = `(${completedCount}/${WATER_SLOTS.length})`;
      document.getElementById('habit-water').checked = (completedCount === WATER_SLOTS.length);
      
      ['exercise', 'read'].forEach(key => {
        const el = document.getElementById(`habit-${key}`);
        if (el) el.checked = !!(currentData.habits && currentData.habits[key]);
      });

      updateProgress();
    }

    function saveNotes(val) { 
      isUserTyping = true;
      currentData.notes = val; 
      saveActiveData(); 
    }

    function exportCurrentDayHTML() {
      const fileName = `${activeDate}.html`;
      const docHtml = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
      const blob = new Blob([docHtml], { type: 'text/html' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = fileName;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(a.href);
    }

    function initTheme() { applyTheme(localStorage.getItem('organizer_dark') === 'true'); }
    function toggleDarkMode() { const isDark = !document.documentElement.classList.contains('dark'); localStorage.setItem('organizer_dark', isDark); applyTheme(isDark); }
    function applyTheme(isDark) {
      if (isDark) { document.documentElement.classList.add('dark'); document.getElementById('theme-icon').textContent = '☀️'; }
      else { document.documentElement.classList.remove('dark'); document.getElementById('theme-icon').textContent = '🌙'; }
    }

    function escapeHtml(str) { return (str || '').replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;"); }
  </script>
</body>
</html>
