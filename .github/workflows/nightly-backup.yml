name: Nightly Google Drive Backup

on:
  schedule:
    # Runs at 11:17 PM EDT (03:17 UTC)
    - cron: '17 3 * * *'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Google APIs
        run: npm install googleapis

      - name: Fetch and Upload Backup
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          GDRIVE_KEY: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_KEY }}
        run: |
          node -e '
          const fs = require("fs");
          const { google } = require("googleapis");

          async function run() {
            // 1. Calculate EDT Date
            const dateStr = new Date().toLocaleDateString("en-US", {
              timeZone: "America/New_York",
              year: "numeric",
              month: "2-digit",
              day: "2-digit"
            }).split("/").reverse().join("-");
            
            // Format YYYY-MM-DD
            const parts = new Date().toLocaleDateString("en-CA", { timeZone: "America/New_York" });
            const fileName = `Organizer_Backup_${parts}.json`;

            console.log(`Fetching data for date: ${parts}...`);

            // 2. Query Supabase
            const res = await fetch(`${process.env.SUPABASE_URL}/rest/v1/organizer_data?date_key=eq.${parts}&select=data`, {
              headers: {
                "apikey": process.env.SUPABASE_ANON_KEY,
                "Authorization": `Bearer ${process.env.SUPABASE_ANON_KEY}`
              }
            });
            const json = await res.json();
            const dataContent = JSON.stringify(json[0]?.data || {}, null, 2);

            fs.writeFileSync(fileName, dataContent);

            // 3. Authenticate Google Drive
            const auth = new google.auth.GoogleAuth({
              credentials: JSON.parse(process.env.GDRIVE_KEY),
              scopes: ["https://www.googleapis.com/auth/drive.file"]
            });
            const drive = google.drive({ version: "v3", auth });

            // 4. Upload to Google Drive Folder
            const fileMetadata = {
              name: fileName,
              parents: ["1PJyX621M0Cm5ziXqZOc-pIOD-cFRQfkB"]
            };
            const media = {
              mimeType: "application/json",
              body: fs.createReadStream(fileName)
            };

            const uploadRes = await drive.files.create({
              resource: fileMetadata,
              media: media,
              fields: "id"
            });

            console.log(`Successfully uploaded backup file! File ID: ${uploadRes.data.id}`);
          }

          run().catch(err => {
            console.error("Backup failed:", err);
            process.exit(1);
          });
          '
