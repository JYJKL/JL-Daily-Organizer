name: Nightly Google Drive Backup

on:
  schedule:
    # Runs at 11:17 PM EDT (03:17 UTC) to avoid runner queue delays
    - cron: '17 3 * * *'
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Today's Data from Supabase
        id: fetch_data
        run: |
          # Step 1: Force Eastern Timezone
          TODAY=$(TZ='America/New_York' date +'%Y-%m-%d')
          echo "TODAY=$TODAY" >> $GITHUB_ENV

          RESPONSE=$(curl -s -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/organizer_data?date_key=eq.${TODAY}&select=data" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")

          # Step 2: Cleanly extract JSON object using jq
          DATA_CONTENT=$(echo "$RESPONSE" | jq -r '.[0].data // {}')

          echo "$DATA_CONTENT" > "Organizer_Backup_${TODAY}.json"

      - name: Upload Backup to Google Drive
        uses: adityak25/google-drive-upload-action@v1
        with:
          credentials: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_KEY }}
          filename: "Organizer_Backup_${{ env.TODAY }}.json"
          folderId: "1PJyX621M0Cm5ziXqZOc-pIOD-cFRQfkB"
          overwrite: true
